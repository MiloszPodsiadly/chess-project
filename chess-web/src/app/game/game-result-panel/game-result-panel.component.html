<section class="result-card" [class.victory]="outcome.perspective === 'WIN'" [class.compact]="dismissed" [attr.aria-label]="title">
  <div class="result-heading">
    <span class="result-symbol" aria-hidden="true">{{ outcome.perspective === 'WIN' ? '♛' : outcome.perspective === 'DRAW' ? '½' : '♟' }}</span>
    <div><h2>{{ title }}</h2><p>{{ reason }}</p></div>
    <strong class="score">{{ notation }}</strong>
  </div>
  <div class="result-meta" *ngIf="!dismissed"><span>{{ opponent }}</span><span>{{ moveLabel }}: {{ outcome.moveCount }}</span></div>
  <div class="result-actions">
    <button type="button" class="primary" (click)="playAgain.emit()">{{ playLabel }}</button>
    <button type="button" class="secondary" *ngIf="!dismissed" (click)="review.emit()">{{ reviewLabel }}</button>
    <button type="button" class="secondary" (click)="changeSetup.emit()">{{ changeLabel }}</button>
  </div>
</section>
