services:

  postgres:
    image: postgres:16-alpine
    container_name: chess-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chessdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d chessdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: chess-backend:local
    container_name: chess-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chessdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/local/bin/stockfish}
      STOCKFISH_THREADS: ${STOCKFISH_THREADS:-0}
      STOCKFISH_HASH_MB: ${STOCKFISH_HASH_MB:-0}
      STOCKFISH_ENGINE_INSTANCES: ${STOCKFISH_ENGINE_INSTANCES:-0}
      STOCKFISH_ACQUIRE_TIMEOUT_MS: ${STOCKFISH_ACQUIRE_TIMEOUT_MS:-1000}
      STOCKFISH_SEARCH_TIMEOUT_MS: ${STOCKFISH_SEARCH_TIMEOUT_MS:-5000}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/engine/health >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./chess-web
      dockerfile: Dockerfile
    image: chess-frontend:local
    container_name: chess-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
